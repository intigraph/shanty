name: Release

on:
  push:
    tags:
      - "v*"

  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    concurrency:
      group: shanty-release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify version tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # THE GATE, and it did not exist before v0.3.0: this workflow went from
      # checkout straight to publish, so a tag on a commit whose CI was red —
      # or had never run at all — shipped binaries to four platforms with a
      # version number that implies somebody checked. CI being green on main is
      # not the same guarantee: a tag can name any commit.
      #
      # Kept as a NAMED WORKFLOW STEP rather than a goreleaser `before` hook so
      # that it is separately reported in the run, instead of buried inside the
      # goreleaser step's log. Same shape as shantytown's release workflow —
      # one owner, one pattern.
      - name: Test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
